# Render Blueprint — https://render.com/docs/infrastructure-as-code
# 대시보드에서 Blueprint로 연결하거나, Web Service를 수동 생성해도 동일한 설정을 맞출 수 있습니다.
services:
  - type: web
    name: dust-calculator
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: API_KEY
        sync: false
      - key: KMA_KEY
        sync: false
